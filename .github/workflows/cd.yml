name: Deploy to Azure

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: git tag or SHA)"
        required: false
        type: string

permissions:
  id-token: write   # OIDC federation
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ secrets.ACR_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 1. Build & push Docker image to ACR first ─────────────────
      #    Must happen before Bicep so the image exists when
      #    Container Apps references it.
      - name: Log in to ACR
        run: |
          # ACR_NAME may be just the registry name or include .azurecr.io
          ACR_SHORT_NAME=$(echo "${{ env.ACR_NAME }}" | sed 's/\.azurecr\.io$//')
          ACR_LOGIN_SERVER="${ACR_SHORT_NAME}.azurecr.io"
          az acr login --name "${ACR_SHORT_NAME}"
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_SHORT_NAME=${ACR_SHORT_NAME}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/profile-agent:${{ steps.tag.outputs.value }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # ── 2. Deploy infrastructure (Bicep) ──────────────────────────
      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        id: infra
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environment=dev
            baseName=profileagent
            imageTag=${{ steps.tag.outputs.value }}
            foundryProjectEndpoint=${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
            entraTenantId=${{ secrets.ENTRA_TENANT_ID || '' }}
            entraClientId=${{ secrets.ENTRA_CLIENT_ID || '' }}
            entraClientSecret=${{ secrets.ENTRA_CLIENT_SECRET || '' }}
            azureOpenAiEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT || '' }}
            azureOpenAiKey=${{ secrets.AZURE_OPENAI_KEY || '' }}
          failOnStdErr: false

      - name: Print app URL
        run: |
          echo "## 🚀 Deployed ${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.infra.outputs.containerAppUrl }}" >> "$GITHUB_STEP_SUMMARY"
