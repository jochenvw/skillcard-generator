name: CD - deploy app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: git tag or SHA)"
        required: false
        type: string

permissions:
  id-token: write   # OIDC federation
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 1. Build & push Docker image to ACR first ─────────────────
      - name: Discover ACR and log in
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].loginServer" -o tsv)
          echo "ACR_NAME=${ACR_NAME}" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          az acr login --name "${ACR_NAME}"

      - name: Determine git info for frontend
        id: gitinfo
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/profile-agent:${{ steps.tag.outputs.value }}"
          docker build \
            --build-arg GIT_SHA=${{ steps.gitinfo.outputs.sha }} \
            --build-arg GIT_TAG=${{ steps.gitinfo.outputs.tag }} \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # ── 2. Deploy infrastructure (Bicep) ──────────────────────────
      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        id: infra
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environment=dev
            baseName=profileagent
            imageTag=${{ steps.tag.outputs.value }}
            foundryProjectEndpoint=${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
            cognitiveServicesAccountId=${{ secrets.COGNITIVE_SERVICES_ACCOUNT_ID }}
            entraTenantId=${{ secrets.ENTRA_TENANT_ID || '' }}
            entraClientId=${{ secrets.ENTRA_CLIENT_ID || '' }}
            entraClientSecret=${{ secrets.ENTRA_CLIENT_SECRET || '' }}
          failOnStdErr: false

      - name: Print app URL
        run: |
          echo "## 🚀 Deployed ${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.infra.outputs.containerAppUrl }}" >> "$GITHUB_STEP_SUMMARY"
