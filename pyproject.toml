[project]
name = "profile-agent"
version = "0.1.0"
description = "Interview-style agent that builds a strengths profile card, powered by Microsoft Agent Framework and Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Microsoft Agent Framework + Foundry hosting
    "agent-framework>=0.1.0a1",
    "azure-ai-agentserver-agentframework>=0.1.0a1",
    "azure-ai-projects>=1.0.0b1",
    "azure-ai-inference>=1.0.0b1",
    # Azure identity & services
    "azure-identity>=1.19.0",
    # Observability
    "azure-monitor-opentelemetry-exporter>=1.0.0b33",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    # Web UI + API
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.34.0",
    "msal>=1.31.0",
    "PyJWT[crypto]>=2.0",
    "python-multipart>=0.0.18",
    # Core utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "respx>=0.22.0",
]

[tool.uv]
prerelease = "allow"

# claude-agent-sdk only ships macOS wheels — exclude on Windows
override-dependencies = [
    "claude-agent-sdk ; sys_platform != 'win32'",
    "agent-framework-claude ; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_agent"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
