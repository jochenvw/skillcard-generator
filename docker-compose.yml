services:
  profile-agent-web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RUN_MODE=web
      - ENVIRONMENT=development
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  profile-agent-foundry:
    build: .
    ports:
      - "8088:8088"
    environment:
      - RUN_MODE=foundry
      - ENVIRONMENT=development
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
    env_file:
      - .env
